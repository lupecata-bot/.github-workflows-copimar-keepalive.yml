name: COPIMAR Supabase Keepalive

on:
  schedule:
    # Cada 3 dias a las 9:00h (hora peninsular)
    - cron: '0 7 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar keepalive
        id: run
        run: |
          pip install requests -q
          python3 - <<'PYEOF'
          import requests, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
      

          URL   = "https://snxqmtaieewnnhrtbgtl.supabase.co"
          KEY   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNueHFtdGFpZWV3bm5ocnRiZ3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0Njc2NzMsImV4cCI6MjA4NjA0MzY3M30.OD5AFXTmvny23v6_CJqc6s2_xewYC672I_ARmQeGy6M"
          H     = {"apikey": KEY, "Authorization": f"Bearer {KEY}", "Content-Type": "application/json"}
          CODES = ["2222", "3333", "4444", "5555"]
          NOTA  = "Keepalive automatico"

          def rest_get(t, p=None):
              r = requests.get(f"{URL}/rest/v1/{t}", params=p, headers=H, timeout=15)
              r.raise_for_status()
              return r.json()

          def rest_post(t, d, ret=True):
              h = {**H, "Prefer": "return=representation"} if ret else H
              r = requests.post(f"{URL}/rest/v1/{t}", json=d, headers=h, timeout=15)
              r.raise_for_status()
              return r.json() if ret else None

          def rest_patch(t, p, d):
              r = requests.patch(f"{URL}/rest/v1/{t}", params=p, json=d, headers=H, timeout=15)
              r.raise_for_status()

          def rest_delete(t, p):
              r = requests.delete(f"{URL}/rest/v1/{t}", params=p, headers=H, timeout=15)
              r.raise_for_status()

          # 1. Borrar registros keepalive anteriores
          print("=== Limpiando registros anteriores ===")
          prev = rest_get("envios", {"select": "id", "notas": "ilike.%keepalive%"})
          if prev:
              ids = ",".join(str(e["id"]) for e in prev)
              rest_delete("lecturas", {"envio_id": f"in.({ids})"})
              rest_delete("envios",   {"id":       f"in.({ids})"})
              print(f"  Borrados {len(prev)} envio(s) anteriores y sus lecturas.\n")
          else:
              print("  Sin registros anteriores.\n")

          # 2. Insertar nuevos registros keepalive
          now   = datetime.now(ZoneInfo("Europe/Madrid"))
          fecha = now.strftime("%Y-%m-%d")
          hora  = now.strftime("%H:%M:%S")
          print(f"=== Insertando lecturas === {fecha} {hora}\n")

          total   = 0
          errores = []

          for code in CODES:
              try:
                  clientes = rest_get("clientes", {"select": "*", "codigo": f"like.%{code}"})
                  cliente  = next((c for c in clientes if str(c["codigo"])[-4:] == code), None)
                  if not cliente:
                      errores.append(f"Codigo {code}: cliente no encontrado")
                      continue

                  equipos = rest_get("equipos", {"select": "*", "codigo_cliente": f"eq.{cliente['codigo']}"})
                  if not equipos:
                      errores.append(f"Codigo {code}: sin equipos")
                      continue

                  envio = rest_post("envios", {
                      "codigo_cliente": cliente["codigo"],
                      "notas":          NOTA,
                      "fecha_envio":    fecha,
                      "hora_envio":     hora
                  })[0]

                  ok = 0
                  for eq in equipos:
                      try:
                          bn = (eq.get("ultimo_bn") or 0) + 1
                          co = (eq.get("ultimo_color") + 1) if eq.get("ultimo_color") is not None else None
                          rest_post("lecturas", {
                              "envio_id": envio["id"], "codigo_cliente": cliente["codigo"],
                              "equipo_id": eq["id"],   "serie": eq["serie"],
                              "contador_bn": bn,        "contador_color": co,
                              "consumo_bn": 1,          "consumo_color": 1 if co is not None else None,
                              "fecha_lectura": fecha,   "hora_lectura": hora
                          }, ret=False)
                          upd = {"fecha_ultima_lectura": fecha, "ultimo_bn": bn}
                          if co is not None:
                              upd["ultimo_color"] = co
                          rest_patch("equipos", {"id": f"eq.{eq['id']}"}, upd)
                          ok    += 1
                          total += 1
                      except Exception as e:
                          errores.append(f"Equipo {eq.get('serie', '?')}: {e}")

                  print(f"  v Codigo {code} ({cliente['nombre']}): {ok}/{len(equipos)} equipo(s)")

              except Exception as e:
                  errores.append(f"Codigo {code}: {e}")
                  print(f"  x Codigo {code}: {e}")

          print(f"\n=== Resumen ===")
          print(f"Total equipos actualizados: {total}")
          if errores:
              print(f"Errores ({len(errores)}):")
              for err in errores:
                  print(f"  x {err}")
              sys.exit(1)
          print("Keepalive completado sin errores v")
          PYEOF

      - name: Enviar email de notificacion
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "COPIMAR Keepalive - ${{ job.status == 'success' && 'EXITO' || 'ERROR' }}"
          to: lupecata@gmail.com
          from: lupecata@gmail.com
          body: |
            Proceso COPIMAR Keepalive ejecutado.

            Estado: ${{ job.status == 'success' && 'EXITO' || 'ERROR' }}

            Ver log completo:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            -- Bot automatico COPIMAR
